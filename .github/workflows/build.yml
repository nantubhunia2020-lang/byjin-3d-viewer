name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -E '^e: ' build.log | head -40 || true
            echo '```'
            echo '### Last lines of the log'
            echo '```'
            tail -n 40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BYJIN-3D-Viewer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
